name: Docker Build

# Pipeline de build automático da imagem Docker da aplicação.
# Roda em todo push/PR para as branches principais do Git Flow.
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

env:
  IMAGE_NAME: senai-gitflow-project

jobs:
  docker-build:
    name: Build e execução da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Executar a imagem (docker run)
        run: docker run --rm ${{ env.IMAGE_NAME }}
